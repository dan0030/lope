<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페어 서사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: var(--lope-accent, #a675b8);
    --text:   var(--lope-text,   #282429);
    --line:   var(--lope-line,   #e8e4ec);
    --bg:     var(--lope-bg,     #ffffff);
    --card:   color-mix(in srgb, var(--lope-text, #282429) 5%, transparent);
    --soft:   color-mix(in srgb, var(--lope-text, #282429) 60%, transparent);
    --faint:  color-mix(in srgb, var(--lope-text, #282429) 38%, transparent);
    --tint:   color-mix(in srgb, var(--lope-accent, #a675b8) 12%, transparent);
    --radius: 14px;
    --sans: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif: 'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;
    --read-size: 17px;
    --read-lh: 1.95;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:transparent; color:var(--text);
    font-family:var(--sans); font-size:15px; line-height:1.6;
    display:flex; flex-direction:column;
    -webkit-text-size-adjust:100%;
  }
  button{ font:inherit; color:inherit; cursor:pointer; }
  button:disabled{ opacity:.4; cursor:default; }
  img{ max-width:100%; display:block; }

  /* 진행 막대 */
  .progress{ height:3px; flex:none; background:transparent; }
  .progress > i{ display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }

  .wrap{
    flex:1; min-height:0; overflow:auto; overflow-x:hidden;
    padding:clamp(14px,4vw,32px);
    scroll-behavior:smooth;
  }
  .col{ max-width:680px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  [hidden]{ display:none !important; }

  .notice{
    font-size:.82rem; color:var(--soft);
    background:var(--card); border:1px dashed var(--line);
    border-radius:10px; padding:10px 12px;
  }

  /* ───── 표지 ───── */
  .cover{
    position:relative; overflow:hidden;
    border-radius:calc(var(--radius) + 4px);
    border:1px solid var(--line);
    min-height:260px; padding:28px 22px 24px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
    background:
      radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 60%),
      radial-gradient(90% 70% at 0% 100%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%),
      var(--card);
  }
  .cover.has-img{ color:#fff; border-color:transparent; }
  .cover .bgimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .cover.has-img::after{
    content:""; position:absolute; inset:0; z-index:0;
    background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.25) 55%, rgba(0,0,0,.05));
  }
  .cover > *:not(.bgimg){ position:relative; z-index:1; }
  .kicker{
    font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); font-weight:700;
  }
  .cover.has-img .kicker{ color:#fff; opacity:.85; }
  .cover h1{
    font-family:var(--serif); font-weight:700;
    font-size:clamp(1.6rem,6.5vw,2.4rem); line-height:1.25; margin:0;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .cover .line{ font-family:var(--serif); font-size:.98rem; opacity:.85; margin:4px 0 0; word-break:keep-all; }
  .cover .meta{ font-size:.8rem; opacity:.7; margin-top:8px; }
  .cover-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

  .btn{
    border:0; border-radius:999px; padding:10px 18px;
    background:var(--accent); color:#fff; font-weight:600;
  }
  .btn.ghost{ background:transparent; color:inherit; border:1px solid currentColor; opacity:.85; font-weight:500; }
  .cover:not(.has-img) .btn.ghost{ border-color:var(--line); }

  /* 등장인물 */
  .sec-title{
    display:flex; align-items:center; gap:10px;
    font-size:.78rem; letter-spacing:.18em; color:var(--soft); font-weight:700; margin:6px 0 -6px;
  }
  .sec-title::after{ content:""; flex:1; height:1px; background:var(--line); }
  .cast{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .person{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; border-top:3px solid var(--c, var(--accent));
    min-width:0;
  }
  .avatar{
    flex:none; width:54px; height:54px; border-radius:50%;
    overflow:hidden; display:grid; place-items:center;
    background:color-mix(in srgb, var(--c, var(--accent)) 22%, transparent);
    color:var(--c, var(--accent)); font-weight:700; font-size:1.3rem;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .person .who{ min-width:0; flex:1; }
  .person .nm{ font-weight:700; font-size:1.02rem; overflow-wrap:anywhere; }
  .person .en{ font-size:.75rem; color:var(--faint); letter-spacing:.06em; margin-left:4px; font-weight:500; }
  .person .role{ font-size:.78rem; color:var(--c, var(--accent)); font-weight:600; }
  .person .intro{ font-size:.86rem; color:var(--soft); margin:6px 0 0; overflow-wrap:anywhere; }
  .person .quote{
    font-family:var(--serif); font-size:.88rem; margin:8px 0 0; padding-left:10px;
    border-left:2px solid var(--c, var(--accent)); overflow-wrap:anywhere;
  }

  .synopsis{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .synopsis h3{ margin:0; font-family:var(--serif); font-size:1.1rem; }
  .synopsis .subt{ font-size:.8rem; color:var(--soft); margin-top:2px; }
  .synopsis p{ font-family:var(--serif); margin:10px 0 0; white-space:pre-line; overflow-wrap:anywhere; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip{ font-size:.75rem; padding:3px 10px; border-radius:999px; background:var(--tint); color:var(--accent); font-weight:600; }

  /* 목차 */
  .toc{ display:flex; flex-direction:column; gap:22px; }
  .toc-group h2{
    margin:0 0 8px; font-size:1rem; display:flex; align-items:baseline; gap:8px;
  }
  .toc-group h2 small{ font-size:.75rem; color:var(--faint); font-weight:500; }
  .toc-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .toc-list li{ border-bottom:1px solid var(--line); }
  .toc-item{
    width:100%; text-align:left; background:none; border:0;
    display:flex; align-items:center; gap:12px; padding:13px 4px;
  }
  .toc-item:not(:disabled):hover{ background:var(--card); }
  .toc-no{
    flex:none; min-width:46px; font-size:.75rem; font-weight:700; color:var(--accent);
    letter-spacing:.04em;
  }
  .toc-main{ flex:1; min-width:0; }
  .toc-t{ display:block; font-family:var(--serif); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toc-s{ display:block; font-size:.75rem; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag{
    flex:none; font-size:.68rem; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line); color:var(--soft);
  }
  .tag.sp{ border-color:color-mix(in srgb, var(--accent) 50%, transparent); color:var(--accent); }
  .empty{ text-align:center; color:var(--faint); padding:36px 10px; font-family:var(--serif); }

  /* ───── 읽기 화면 ───── */
  .bar{
    position:sticky; top:calc(-1 * clamp(14px,4vw,32px)); z-index:5;
    margin:calc(-1 * clamp(14px,4vw,32px)) calc(-1 * clamp(14px,4vw,32px)) 0;
    padding:10px clamp(14px,4vw,32px);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar-in{ max-width:680px; margin:0 auto; display:flex; align-items:center; gap:6px; }
  .bar .where{ flex:1; min-width:0; font-size:.8rem; color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .icon-btn{
    flex:none; background:none; border:1px solid var(--line); border-radius:999px;
    padding:5px 11px; font-size:.8rem; line-height:1.4;
  }
  .icon-btn[aria-pressed="true"]{ background:var(--tint); border-color:transparent; color:var(--accent); font-weight:600; }
  .settings{
    max-width:680px; margin:10px auto 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    font-size:.78rem; color:var(--soft);
  }
  .settings .grp{ display:flex; gap:4px; align-items:center; margin-right:8px; }

  .chapter{ padding-top:clamp(20px,6vw,44px); }
  .ch-head{ text-align:center; margin-bottom:clamp(26px,7vw,44px); }
  .ch-no{ font-size:.75rem; letter-spacing:.24em; color:var(--accent); font-weight:700; }
  .ch-title{
    font-family:var(--serif); font-weight:700; margin:10px 0 6px;
    font-size:clamp(1.35rem,5.4vw,1.85rem); line-height:1.35; word-break:keep-all; overflow-wrap:anywhere;
  }
  .ch-sub{ font-size:.82rem; color:var(--faint); }
  .ch-orn{ display:block; margin:18px auto 0; width:40px; height:1px; background:var(--accent); opacity:.6; }
  .ch-img{ border-radius:var(--radius); margin:0 auto clamp(22px,6vw,36px); max-height:60vh; object-fit:cover; width:100%; }

  .prose{
    font-family:var(--serif); font-size:var(--read-size); line-height:var(--read-lh);
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .prose.sans{ font-family:var(--sans); }
  .prose p{ margin:0 0 1.15em; text-indent:1em; }
  .prose p.dlg, .prose p.nar, .prose p.center{ text-indent:0; }
  .prose p.center{ text-align:center; color:var(--faint); letter-spacing:.4em; }
  .prose p.nar{ color:var(--soft); font-style:italic; }
  .prose .spk{
    display:block; font-family:var(--sans); font-size:.72em; font-weight:700;
    letter-spacing:.04em; color:var(--c, var(--accent)); margin-bottom:.1em;
  }
  .prose .time{ font-family:var(--sans); font-size:.68em; color:var(--faint); margin-left:6px; font-weight:400; }

  .veil{
    text-align:center; padding:34px 18px; border:1px dashed var(--line); border-radius:var(--radius);
    background:var(--card);
  }
  .veil p{ margin:0 0 14px; color:var(--soft); font-size:.9rem; }

  .ch-end{ text-align:center; color:var(--faint); font-size:.8rem; letter-spacing:.3em; margin:30px 0 8px; }
  .pager{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 8px; }
  .pager button{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; text-align:left; min-width:0;
  }
  .pager button.next{ text-align:right; }
  .pager small{ display:block; font-size:.72rem; color:var(--faint); }
  .pager span{ display:block; font-family:var(--serif); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .back-toc{ display:block; margin:6px auto 20px; background:none; border:0; color:var(--accent); font-weight:600; padding:8px; }

  /* 원고 편집 (주인 전용) */
  .editor textarea{
    width:100%; min-height:320px; resize:vertical;
    font:15px/1.8 var(--serif); color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
  }
  .editor .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:10px; }
  .editor .help{ font-size:.8rem; color:var(--soft); margin:0 0 8px; }
  .editor code{ background:var(--tint); color:var(--accent); padding:0 5px; border-radius:4px; }

  .foot{ text-align:center; font-size:.72rem; color:var(--faint); padding:10px 0 4px; }

  html[data-lope-theme="dark"] .cover.has-img::after{
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.35) 55%, rgba(0,0,0,.1));
  }
  @media (max-width:400px){
    .wrap{ padding:14px; }
    .bar{ top:-14px; margin:-14px -14px 0; padding:9px 14px; }
    .cover{ padding:22px 16px 18px; min-height:220px; }
    .cast{ grid-template-columns:1fr; }
    .toc-no{ min-width:40px; }
  }
</style>
</head>
<body>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <main class="wrap" id="wrap">

    <!-- 표지 + 목차 -->
    <section id="home" class="col">
      <div id="notice" class="notice" hidden></div>
      <header class="cover" id="cover">
        <span class="kicker" id="kicker">PAIR NOVEL</span>
        <h1 id="bookTitle">두 사람의 이야기</h1>
        <p class="line" id="bookLine" hidden></p>
        <div class="meta" id="bookMeta"></div>
        <div class="cover-actions">
          <button class="btn" id="startBtn" type="button">첫 화부터 읽기</button>
          <button class="btn ghost" id="editBtn" type="button" hidden>원고 쓰기</button>
        </div>
      </header>

      <div class="sec-title" id="castTitle" hidden>등장인물</div>
      <div class="cast" id="cast"></div>

      <div id="synopsis"></div>

      <div class="sec-title">목차</div>
      <nav class="toc" id="toc" aria-label="목차"></nav>

      <p class="foot">읽던 위치와 글자 설정은 저장되지 않아요. 페이지를 새로 열면 표지부터 시작합니다.</p>
    </section>

    <!-- 읽기 -->
    <section id="reader" hidden>
      <div class="bar">
        <div class="bar-in">
          <button class="icon-btn" id="toHome" type="button" aria-label="목차로">☰ 목차</button>
          <div class="where" id="where"></div>
          <button class="icon-btn" id="setBtn" type="button" aria-expanded="false" aria-controls="settings">가 설정</button>
        </div>
        <div class="settings" id="settings" hidden>
          <div class="grp">글자
            <button class="icon-btn" type="button" data-size="-1" aria-label="글자 작게">가−</button>
            <button class="icon-btn" type="button" data-size="1" aria-label="글자 크게">가+</button>
          </div>
          <div class="grp">줄간격
            <button class="icon-btn" type="button" data-lh="1.7">좁게</button>
            <button class="icon-btn" type="button" data-lh="1.95" aria-pressed="true">보통</button>
            <button class="icon-btn" type="button" data-lh="2.25">넓게</button>
          </div>
          <div class="grp">서체
            <button class="icon-btn" type="button" data-font="serif" aria-pressed="true">명조</button>
            <button class="icon-btn" type="button" data-font="sans">고딕</button>
          </div>
        </div>
      </div>
      <article class="col chapter" id="chapter"></article>
    </section>

    <!-- 원고 편집 (주인만) -->
    <section id="editor" class="col editor" hidden>
      <h2 style="margin:0;font-family:var(--serif)">연재 원고</h2>
      <p class="help">
        <code># 제목</code>으로 시작하는 줄마다 새 화가 됩니다. 제목 아래 <code>&gt; 부제</code> 한 줄을 넣으면 부제가 됩니다.
        빈 줄로 문단을 나누고, <code>***</code> 한 줄은 장면 전환 표시가 됩니다.
        이렇게 쓴 화는 목차의 <b>본편</b>에 올라가고, 연표·대화는 그 아래로 내려갑니다.
      </p>
      <textarea id="draft" spellcheck="false" placeholder="# 1화. 처음 만난 날&#10;&gt; 봄비가 내리던 오후&#10;&#10;문이 열리고, 낯선 얼굴이 들어왔다."></textarea>
      <div class="row">
        <button class="btn ghost" id="draftDownload" type="button">파일로 받기</button>
        <button class="btn ghost" id="draftCancel" type="button">취소</button>
        <button class="btn" id="draftSave" type="button">사이트에 저장</button>
      </div>
    </section>
  </main>

<script>
(function(){
  "use strict";
  const L = window.LOPE_HTML_PAGE || {};
  const live = (L && L.siteData) || null;
  const $ = (id) => document.getElementById(id);

  /* ───────── 예시 데이터 (사이트 데이터가 없을 때) ───────── */
  const SAMPLE = {
    site:{ title:"예시 사이트", pairName:"새벽과 윤슬", pairLine:"끝내 서로에게 닿는 두 개의 빛" },
    characters:[
      { key:"A", name:"한새벽", eng:"SAEBYEOK", role:"등대지기", color:"#6f8fd6",

      { key:"B", name:"서윤슬", eng:"YUNSEUL", role:"떠돌이 화가", color:"#d68f6f",

      summary:"폭풍이 지난 아침, 섬에 표류한 화가와 그를 발견한 등대지기.\n한 계절만 머물겠다던 약속은 자꾸만 미뤄진다.",

    ],
    dialogue:[{ worldId:"main", worldLabel:"MAIN", folders:[], scenes:[
      { id:"d1", title:"등대의 밤", subtitle:"외전",

          { side:"left",  name:"한새벽", color:"#6f8fd6", text:"매일 닿아요. 그게 일이니까." },

    ]}]
  };

  const data = live || SAMPLE;
  const arr = (v) => Array.isArray(v) ? v : [];
  const str = (v) => (v == null ? "" : String(v)).trim();

  if (!live){
    const n = $("notice"); n.hidden = false;
    n.textContent = L.pageId
      ? "지금은 예시 이야기를 보여주고 있어요. 관리자 → 이 페이지 설정에서 \"이 페이지에 사이트 데이터 넘기기\"를 켜면 이 사이트의 서사로 바뀝니다."
      : "예시 이야기를 보여주고 있어요. LOPE에 넣고 \"이 페이지에 사이트 데이터 넘기기\"를 켜면 사이트의 서사가 그대로 실립니다.";
  } else if (data.imagesOmitted){
    const n = $("notice"); n.hidden = false;
    n.textContent = "사이트 용량 때문에 사진 " + data.imagesOmitted + "장은 빠진 채로 보여요.";
  }

  /* ───────── 작은 도구 ───────── */
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== "") e.textContent = text;
    return e;
  }
  const isUrl = (s) => /^(https?:|data:image\/)/i.test(s);
  function safeColor(c){
    c = str(c);
    return /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%deg]+\)|[a-z]{3,20})$/i.test(c) ? c : "";
  }
  function img(src, alt, cls){
    const i = el("img", cls); i.src = src; i.alt = alt || ""; i.loading = "lazy"; i.decoding = "async";
    i.addEventListener("error", () => i.remove());
    return i;
  }
  // 주인이 쓴 글이 HTML로 저장돼 있어도 글자만 뽑아낸다
  function toPlain(v){
    if (v == null) return "";
    if (typeof v !== "string"){
      if (typeof v === "object" && typeof v.text === "string") v = v.text;
      else if (typeof v === "object" && typeof v.html === "string") v = v.html;
      else return "";
    }
    if (/<\/?[a-z][\s\S]*>/i.test(v)){
      const tmp = v.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|h[1-6]|li|blockquote)>/gi, "\n\n");
      const doc = new DOMParser().parseFromString(tmp, "text/html");
      return (doc.body.textContent || "").replace(/\n{3,}/g, "\n\n");
    }
    return v;
  }

  /* ───────── 페어와 등장인물 ───────── */
  const chars = arr(data.characters);
  const byKey = {};
  chars.forEach(c => { if (c && c.key) byKey[c.key] = c; });
  const rels = arr(data.relationships);
  const rel = rels.find(r => arr(r.memberKeys).length >= 2) || rels[0] || null;
  let pair = rel ? arr(rel.memberKeys).map(k => byKey[k]).filter(Boolean) : [];
  if (!pair.length) pair = chars.slice(0, 2);
  const pairKeys = new Set(pair.map(c => c.key));

  // 이름 → 색 (대화 장면의 화자 색이 비었을 때 보충)
  const colorByName = {};
  chars.forEach(c => { if (c && c.name) colorByName[str(c.name)] = safeColor(c.color); });

  /* ───────── 표지 ───────── */
  const site = data.site || {};
  const title = str(site.pairName) || (pair.length ? pair.map(c => str(c.name)).filter(Boolean).join(" × ") : "") || str(site.title) || "두 사람의 이야기";
  $("bookTitle").textContent = title;
  document.title = title;
  const line = str(site.pairLine) || (rel ? str(rel.subtitle) : "");
  if (line){ $("bookLine").hidden = false; $("bookLine").textContent = line; }
  if (str(site.auLabel) && str(site.auId) && site.auId !== "main") $("kicker").textContent = "PAIR NOVEL · " + str(site.auLabel);

  const hero = str(L.heroImage);
  if (hero && isUrl(hero)){
    const cv = $("cover"); cv.classList.add("has-img");
    const bi = img(hero, "", "bgimg");
    bi.addEventListener("error", () => cv.classList.remove("has-img"));
    cv.prepend(bi);
  }

  /* 등장인물 카드 */
  function avatar(c){
    const a = el("div", "avatar");
    const src = [c.profileImage, c.image, c.icon].map(str).find(isUrl);
    const ic = str(c.icon);
    if (src){
      const i = img(src, str(c.name));
      i.addEventListener("error", () => { a.textContent = (ic && !isUrl(ic)) ? ic : (str(c.name)[0] || "?"); });
      a.appendChild(i);
    } else {
      a.textContent = (ic && !isUrl(ic) && ic.length <= 4) ? ic : (str(c.name)[0] || "?");
    }
    return a;
  }
  if (pair.length){
    $("castTitle").hidden = false;
    pair.forEach(c => {
      const card = el("div", "person");
      const col = safeColor(c.color); if (col) card.style.setProperty("--c", col);
      card.appendChild(avatar(c));
      const w = el("div", "who");
      const nm = el("div", "nm", str(c.name) || "이름 없음");
      if (str(c.eng)) nm.appendChild(el("span", "en", str(c.eng)));
      w.appendChild(nm);
      if (str(c.role)) w.appendChild(el("div", "role", str(c.role)));
      const intro = str(c.short) || str(c.intro);
      if (intro) w.appendChild(el("p", "intro", intro.length > 120 ? intro.slice(0, 118) + "…" : intro));
      if (str(c.quote)) w.appendChild(el("p", "quote", "“" + str(c.quote).replace(/^["“”]|["“”]$/g, "") + "”"));
      card.appendChild(w);
      $("cast").appendChild(card);
    });
  }

  /* 줄거리 */
  if (rel && (str(rel.summary) || str(rel.name))){
    const s = el("div", "synopsis");
    s.appendChild(el("h3", "", str(rel.name) || "줄거리"));
    if (str(rel.subtitle) && str(rel.subtitle) !== line) s.appendChild(el("div", "subt", str(rel.subtitle)));
    if (str(rel.summary)) s.appendChild(el("p", "", str(rel.summary)));
    const kws = arr(rel.keywords).map(str).filter(Boolean);
    if (kws.length){
      const ch = el("div", "chips");
      kws.forEach(k => ch.appendChild(el("span", "chip", "#" + k)));
      s.appendChild(ch);
    }
    $("synopsis").appendChild(s);
  }

  /* ───────── 화(chapter) 만들기 ───────── */
  // 본문 글 → 문단
  function writeProse(box, text){
    const lines = String(text || "").replace(/\r/g, "").split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (!lines.length){ box.appendChild(el("p", "center", "· · ·")); return; }
    lines.forEach(t => {
      if (/^(\*{3,}|-{3,}|◇+|◆+|…{2,}|·\s*·\s*·)$/.test(t)) box.appendChild(el("p", "center", "◇"));
      else if (/^["“「『'‘]/.test(t)) box.appendChild(el("p", "dlg", t));
      else box.appendChild(el("p", "", t));
    });
  }

  const groups = [];   // [{ name, note, items:[chapter] }]
  const flat = [];     // 읽을 수 있는 화만, 순서대로

  // 1) 주인이 이 페이지에 직접 쓴 연재 원고
  const manuscript = toPlain(L.richText);
  function parseManuscript(src){
    const out = []; let cur = null;
    String(src || "").replace(/\r/g, "").split("\n").forEach(raw => {
      const t = raw.trim();
      const h = /^#{1,3}\s+(.+)$/.exec(t);
      if (h){ cur = { title:h[1].trim(), sub:"", body:[] }; out.push(cur); return; }
      if (!cur){ if (!t) return; cur = { title:"", sub:"", body:[] }; out.push(cur); }
      if (!cur.body.length && !cur.sub && /^>\s*/.test(t)){ cur.sub = t.replace(/^>\s*/, ""); return; }
      cur.body.push(raw);
    });
    return out.filter(c => c.title || c.body.join("").trim());
  }
  const ms = parseManuscript(manuscript);
  if (ms.length){
    groups.push({ name:"본편", items: ms.map((c, i) => ({
      id:"m" + i, no:"제" + (i + 1) + "화", title:c.title || ("제" + (i + 1) + "화"), sub:c.sub,
      render(box){ writeProse(box, c.body.join("\n")); }
    })) });
  }

  // 2) 연표 → 서사 (페어가 나오는 사건 우선, 없으면 전부)
  const tl = arr(data.timeline).filter(Boolean);
  let tlPair = tl.filter(t => {
    const mk = arr(t.memberKeys);
    return !mk.length || mk.some(k => pairKeys.has(k));
  });
  if (!tlPair.length) tlPair = tl;
  if (tlPair.length){
    let n = 0;
    groups.push({ name: ms.length ? "연대기" : "본편", items: tlPair.map((t, i) => {
      if (t.locked) return { id:"t" + i, locked:true, no:"", title:"잠긴 화", sub:str(t.year) };
      n++;
      const mk = arr(t.memberKeys).map(k => byKey[k]).filter(Boolean).map(c => str(c.name)).filter(Boolean);
      return {
        id:"t" + i, no:"제" + n + "화", title:str(t.title) || str(t.year) || ("제" + n + "화"),
        sub:[str(t.year), mk.join(" · ")].filter(Boolean).join("  |  "),
        image: isUrl(str(t.image)) ? str(t.image) : "",
        spoiler: !!t.spoiler,
        render(box){ writeProse(box, t.text); }
      };
    }) });
  }

  // 3) 대화 장면 → 외전 (대본을 소설처럼)
  const scenes = [];
  arr(data.dialogue).forEach(w => {
    const wl = str(w && w.worldLabel);
    const push = (s, folder) => { if (s && arr(s.messages).length) scenes.push({ s, wl, folder }); };
    arr(w && w.scenes).forEach(s => push(s, ""));
    arr(w && w.folders).forEach(f => arr(f && f.scenes).forEach(s => push(s, str(f.name))));
  });
  if (scenes.length){
    groups.push({ name:"외전", note:"대화 장면", items: scenes.map((o, i) => ({
      id:"d" + i, no:"외전 " + (i + 1), title:str(o.s.title) || ("외전 " + (i + 1)),
      sub:[str(o.s.subtitle), o.folder, scenes.some(x => x.wl !== o.wl) ? o.wl : ""].filter(Boolean).join("  |  "),
      render(box){
        arr(o.s.messages).forEach(m => {
          const t = str(m && m.text);
          if (!t) return;
          if (m.side === "narration"){ t.split(/\n+/).forEach(x => x.trim() && box.appendChild(el("p", "nar", x.trim()))); return; }
          const p = el("p", "dlg");
          const nm = str(m.name);
          const col = safeColor(m.color) || colorByName[nm];
          if (col) p.style.setProperty("--c", col);
          if (nm){
            const sp = el("span", "spk", nm);
            if (str(m.time)) sp.appendChild(el("span", "time", str(m.time)));
            p.appendChild(sp);
          }
          p.appendChild(document.createTextNode("“" + t.replace(/^["“]|["”]$/g, "") + "”"));
          box.appendChild(p);
        });
      }
    })) });
  }

  groups.forEach(g => g.items.forEach(c => { if (!c.locked){ c.group = g.name; flat.push(c); } }));

  /* 목차 */
  const toc = $("toc");
  if (!groups.length){
    toc.appendChild(el("p", "empty", "아직 실린 이야기가 없어요.\n연표나 대화 장면을 추가하면 여기에 화가 생깁니다."));
    $("startBtn").disabled = true;
  }
  groups.forEach(g => {
    const box = el("section", "toc-group");
    const h = el("h2", "", g.name);
    h.appendChild(el("small", "", g.items.filter(c => !c.locked).length + "화" + (g.note ? " · " + g.note : "")));
    box.appendChild(h);
    const ul = el("ul", "toc-list");
    g.items.forEach(c => {
      const li = el("li");
      const b = el("button", "toc-item"); b.type = "button";
      b.appendChild(el("span", "toc-no", c.locked ? "🔒" : c.no));
      const m = el("span", "toc-main");
      m.appendChild(el("span", "toc-t", c.title));
      if (c.sub) m.appendChild(el("span", "toc-s", c.sub));
      b.appendChild(m);
      if (c.locked){ b.disabled = true; b.appendChild(el("span", "tag", "잠김")); }
      else {
        if (c.spoiler) b.appendChild(el("span", "tag sp", "스포일러"));
        b.addEventListener("click", () => openChapter(flat.indexOf(c)));
      }
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
    toc.appendChild(box);
  });

  const totalTxt = [];
  if (flat.length) totalTxt.push("총 " + flat.length + "화");
  if (pair.length) totalTxt.push(pair.map(c => str(c.name)).filter(Boolean).join(" · "));
  $("bookMeta").textContent = totalTxt.join("  —  ");

  /* ───────── 읽기 ───────── */
  const wrap = $("wrap"), home = $("home"), reader = $("reader"), editor = $("editor");
  let cur = -1, homeScroll = 0;

  function show(view){
    home.hidden = view !== "home"; reader.hidden = view !== "reader"; editor.hidden = view !== "editor";
  }

  function openChapter(i){
    if (i < 0 || i >= flat.length) return;
    if (!home.hidden) homeScroll = wrap.scrollTop;
    cur = i;
    const c = flat[i];
    const art = $("chapter"); art.textContent = "";
    $("where").textContent = c.group + " · " + c.no;

    const head = el("header", "ch-head");
    head.appendChild(el("div", "ch-no", c.no));
    head.appendChild(el("h2", "ch-title", c.title));
    if (c.sub) head.appendChild(el("div", "ch-sub", c.sub));
    head.appendChild(el("span", "ch-orn"));
    art.appendChild(head);

    const body = el("div");
    const fill = () => {
      body.textContent = "";
      if (c.image) body.appendChild(img(c.image, "", "ch-img"));
      const prose = el("div", "prose" + (fontMode === "sans" ? " sans" : ""));
      c.render(prose);
      body.appendChild(prose);
      body.appendChild(el("div", "ch-end", "— " + c.no + " 끝 —"));
    };
    if (c.spoiler){
      const v = el("div", "veil");
      v.appendChild(el("p", "", "스포일러가 담긴 화예요. 준비됐다면 펼쳐 주세요."));
      const b = el("button", "btn", "펼치기"); b.type = "button";
      b.addEventListener("click", () => { fill(); onScroll(); });
      v.appendChild(b); body.appendChild(v);
    } else fill();
    art.appendChild(body);

    const pg = el("div", "pager");
    const prev = el("button", "prev"); prev.type = "button";
    prev.appendChild(el("small", "", "← 이전 화"));
    prev.appendChild(el("span", "", i > 0 ? flat[i - 1].title : "처음입니다"));
    prev.disabled = i === 0;
    prev.addEventListener("click", () => openChapter(i - 1));
    const next = el("button", "next"); next.type = "button";
    next.appendChild(el("small", "", "다음 화 →"));
    next.appendChild(el("span", "", i < flat.length - 1 ? flat[i + 1].title : "마지막 화예요"));
    next.disabled = i === flat.length - 1;
    next.addEventListener("click", () => openChapter(i + 1));
    pg.appendChild(prev); pg.appendChild(next);
    art.appendChild(pg);
    const bt = el("button", "back-toc", "목차로 돌아가기"); bt.type = "button";
    bt.addEventListener("click", goHome);
    art.appendChild(bt);

    show("reader");
    wrap.style.scrollBehavior = "auto"; wrap.scrollTop = 0; wrap.style.scrollBehavior = "";
    onScroll();
  }

  function goHome(){
    show("home"); cur = -1;
    wrap.style.scrollBehavior = "auto"; wrap.scrollTop = homeScroll; wrap.style.scrollBehavior = "";
    onScroll();
  }

  $("startBtn").addEventListener("click", () => openChapter(0));
  $("toHome").addEventListener("click", goHome);

  function onScroll(){
    const p = $("prog");
    if (reader.hidden){ p.style.width = "0"; return; }
    const max = wrap.scrollHeight - wrap.clientHeight;
    p.style.width = (max > 0 ? Math.min(100, wrap.scrollTop / max * 100) : 100) + "%";
  }
  wrap.addEventListener("scroll", onScroll, { passive:true });

  document.addEventListener("keydown", (e) => {
    if (reader.hidden || e.target.closest("textarea,input")) return;
    if (e.key === "ArrowLeft") openChapter(cur - 1);
    else if (e.key === "ArrowRight") openChapter(cur + 1);
    else if (e.key === "Escape") goHome();
  });

  /* 읽기 설정 (저장되지 않음) */
  let size = 17, fontMode = "serif";
  const root = document.documentElement;
  $("setBtn").addEventListener("click", () => {
    const s = $("settings"); s.hidden = !s.hidden;
    $("setBtn").setAttribute("aria-expanded", String(!s.hidden));
  });
  document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => {
    size = Math.max(14, Math.min(24, size + Number(b.dataset.size)));
    root.style.setProperty("--read-size", size + "px");
  }));
  document.querySelectorAll("[data-lh]").forEach(b => b.addEventListener("click", () => {
    root.style.setProperty("--read-lh", b.dataset.lh);
    document.querySelectorAll("[data-lh]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  document.querySelectorAll("[data-font]").forEach(b => b.addEventListener("click", () => {
    fontMode = b.dataset.font;
    document.querySelectorAll(".prose").forEach(p => p.classList.toggle("sans", fontMode === "sans"));
    document.querySelectorAll("[data-font]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  /* ───────── 원고 쓰기 (주인 전용) ───────── */
  if (L.admin === true && L.pageId){
    const eb = $("editBtn"); eb.hidden = false;
    eb.addEventListener("click", () => {
      homeScroll = wrap.scrollTop;
      $("draft").value = manuscript;
      show("editor"); wrap.scrollTop = 0;
    });
    $("draftCancel").addEventListener("click", goHome);
    $("draftSave").addEventListener("click", () => {
      parent.postMessage({ type:"lope-html-page-save-rich-text", pageId:L.pageId, richText:$("draft").value }, "*");
      $("draftSave").textContent = "저장 요청함 — 페이지가 새로 열리면 반영돼요";
      $("draftSave").disabled = true;
    });
  }
  $("draftDownload").addEventListener("click", () => {
    const blob = new Blob([$("draft").value], { type:"text/plain;charset=utf-8" });
    const a = el("a"); a.href = URL.createObjectURL(blob); a.download = (title || "원고") + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
